# pnpm CI — parallel lint / format / typecheck / build
# Copy to .github/workflows/ci.yml and align script names with package.json.
#
# Assumed scripts:
#   pnpm lint
#   pnpm format:check
#   pnpm typecheck
#   pnpm build
#
# Monorepo tip: replace scripts with filtered commands, e.g.
#   pnpm --filter ./apps/web... lint

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-pnpm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Fail if lockfile would change
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads packageManager from package.json when present

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          # Fallback if package.json has no engines/packageManager engines field:
          # node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, format, typecheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify jobs succeeded
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.format.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
